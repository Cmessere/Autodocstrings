[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodocstrings"
version = "0.1.0"
description = "A deterministic CLI that tracks docstring staleness across a codebase, for use by coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Carlo Messere" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
autodoc = "autodocstrings.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autodocstrings"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
